name: Recovery scan isolated review
on:
  push:
    branches: [fix/recovery-scan-progress-20260922]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive exact tracked source only
        run: |
          mkdir -p /tmp/recovery-evidence
          git rev-parse HEAD > /tmp/recovery-evidence/source-sha.txt
          git archive --format=zip HEAD > /tmp/recovery-evidence/source.zip
          find . -name AGENTS.md -not -path './.git/*' -print > /tmp/recovery-evidence/rules-paths.txt
      - name: Prepare locked dependencies and public tokenizer data
        env:
          TIKTOKEN_CACHE_DIR: /tmp/recovery-evidence/tiktoken
        run: |
          set -euo pipefail
          python3 -m pip install uv
          uv sync --locked
          uv pip install pytest pytest-subtests requests
          uv pip freeze > /tmp/recovery-evidence/requirements.txt
          uv run python -c 'import tiktoken; [tiktoken.get_encoding(name) for name in tiktoken.list_encoding_names()]'
      - name: Owning checks when repair exists
        if: hashFiles('test/test_recovery_scan_progress.py') != ''
        env:
          PROVIDER_DATA_DIR: /tmp/recovery-data
          TIKTOKEN_CACHE_DIR: /tmp/recovery-evidence/tiktoken
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-data
          uv run pytest -q test/test_recovery_scan_progress.py 2>&1 | tee /tmp/recovery-evidence/targeted.log
          uv run pytest -q test 2>&1 | tee /tmp/recovery-evidence/owning.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-scan-review
          path: /tmp/recovery-evidence/
          retention-days: 7
