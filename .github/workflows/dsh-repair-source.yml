name: DSH repair source snapshot
on:
  push:
    branches: [fix/dsh-session-continuity-20260921]
    paths: [.github/workflows/dsh-repair-source.yml]
permissions:
  contents: read
jobs:
  test-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package owning test dependencies from tracked source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures"
          git archive --format=tar.gz --output="$RUNNER_TEMP/fixtures/provider-test-fixtures.tar.gz" HEAD scripts examples README.md .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-repair-provider-test-fixtures
          path: ${{ runner.temp }}/fixtures/
          retention-days: 3
