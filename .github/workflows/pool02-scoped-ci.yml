  push:
    branches:
      - main
      - codex/**
    paths:
      - .github/workflows/pool02-scoped-ci.yml
      - .github/workflows/company-queue-fallback.yml
      - .github/workflows/docker-publish.yml
      - tools/ci/provider-company-queue-fallback.sh
      - api/product_works.py
      - services/account_request_pacing.py
      - services/account_service.py
      - services/oauth_login_service.py
      - utils/sentinel.py
      - test/test_auth_tls_verification.py
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - services/admission_planner.py
      - services/image_task_service.py
      - services/request_context.py
      - services/work_lifecycle.py
      - test/test_original_operation_budget.py
      - test/test_product_compact_successor.py
      - test/test_incomplete_compact_successor.py
      - test/test_plain_unsent_successor_resume.py
      - test/test_unsent_category_successor.py
      - test/test_product_fairness.py
      - test/test_product_work_api.py
      - test/test_product_work_admission.py
      - test/test_admission_planner.py
      - test/test_bound_text_archive.py
      - test/test_explicit_unknown_successor.py
      - test/test_public_chat_sessions.py
      - test/test_work_lifecycle.py
      - test/test_no_final_successor.py
      - test/test_combined_copy_derivation.py
      - test/test_account_request_pacing.py
      - services/conversation_binding_service.py
      - services/pool_admission.py
      - services/product_work.py
      - services/task_store.py
      - services/text_task_service.py
      - services/public_chat_service.py
      - services/openai_backend_api.py
      - services/model_service.py
      - services/workflow_scheduling.py
      - utils/helper.py
      - test/test_text_stream_diagnostics.py
      - test/test_text_stream_handoff.py
      - test/test_model_catalog_service.py
      - test/test_workflow_scheduling.py
      - test/test_background_original_reads.py
      - test/test_pool_admission.py
      - test/test_stalled_text_diagnostics.py
      - test/test_sent_outcome_consistency.py
      - test/test_recovery_control.py
      - test/test_unknown_turn_recovery.py
      - test/test_image_metadata_refresh_liveness.py
      - test/test_product_work.py
      - test/test_rejected_chat_successor.py
      - test/test_unsent_bound_retry.py
      - test/test_missing_node_chain_lifecycle.py
      - test/test_queued_combined_copy_compaction.py
      - test/test_conversation_continuation.py
      - test/test_recovery_scan_progress.py
      - test/test_reconcile_queued_successor.py
      - test/test_ci_fallback_workflow.py
      - test/test_ci_fallback_observer.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact trusted push commit to test
        required: true
        type: string
      github_hosted:
        description: Run this exact source on GitHub-hosted capacity after the company queue fallback
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scoped-chat-admission:
    # Only pushes created in this repository reach the persistent company runner.
    # Review external contributions first, then bring approved code into a trusted
    # main or codex/** branch with write access; fork PRs never execute here.
    # GitHub contributor approval and runner-group policy remain independent controls.
    if: ${{ github.repository == 'sunnywang666/chatgpt2api' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')))) }}
    runs-on: ${{ inputs.github_hosted == true && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","hugsweet-linux-ci"]') }}
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CHATGPT2API_AUTH_KEY: isolated-pool02-fixture
      PROVIDER_DATA_DIR: /tmp/provider-pool02-fixture
      TIKTOKEN_CACHE_DIR: /tmp/provider-pool02-tokenizer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact reviewed source
        env:
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$DISPATCH_SHA" = "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies and pytest
        run: |
          python -m pip install --disable-pip-version-check uv pytest==9.1.1
          uv sync --frozen
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple pytest==9.1.1
          mkdir -p "$PROVIDER_DATA_DIR" "$TIKTOKEN_CACHE_DIR"
      - name: Test account admission and bounded recovery
        run: |
          .venv/bin/python -m compileall -q api services utils test
          .venv/bin/python -m pytest -q \
            test/test_pool_admission.py \
            test/test_auth_tls_verification.py \
            test/test_stalled_text_diagnostics.py \
            test/test_sent_outcome_consistency.py \
            test/test_recovery_control.py \
            test/test_original_operation_budget.py \
            test/test_product_compact_successor.py \
            test/test_product_fairness.py \
            test/test_product_work_api.py \
            test/test_product_work_admission.py \
            test/test_admission_planner.py \
            test/test_bound_text_archive.py \
            test/test_explicit_unknown_successor.py \
            test/test_public_chat_sessions.py \
            test/test_work_lifecycle.py \
            test/test_no_final_successor.py \
            test/test_combined_copy_derivation.py \
            test/test_account_request_pacing.py \
            test/test_image_metadata_refresh_liveness.py \
            test/test_product_work.py \
            test/test_rejected_chat_successor.py \
            test/test_unsent_bound_retry.py \
            test/test_missing_node_chain_lifecycle.py \
            test/test_queued_combined_copy_compaction.py \
            test/test_background_original_reads.py \
            test/test_pool_resources.py \
            test/test_scoped_chat_slot_api.py \
            test/test_editable_pool_admission.py \
            test/test_pool_admission_identity.py \
            test/test_text_task_service.py \
            test/test_unknown_turn_recovery.py \
            test/test_text_stream_diagnostics.py \
            test/test_text_stream_handoff.py \
            test/test_model_catalog_service.py \
            test/test_workflow_scheduling.py \
            test/test_image_task_service.py \
            test/test_reliable_pool_routes.py \
            test/test_non_text_recovery.py \
            test/test_image_thread_continuity.py \
            test/test_incomplete_compact_successor.py \
            test/test_plain_unsent_successor_resume.py \
            test/test_unsent_category_successor.py \
            test/test_conversation_continuation.py \
            test/test_recovery_scan_progress.py \
            test/test_reconcile_queued_successor.py \
            test/test_ci_fallback_workflow.py \
            test/test_ci_fallback_observer.py
