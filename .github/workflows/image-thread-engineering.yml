name: Image thread continuity engineering
on:
  push:
    branches: [fix/image-thread-continuity-20260923]
permissions:
  contents: write
jobs:
  engineering:
    if: startsWith(github.event.head_commit.message, 'chore(thread03)')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHATGPT2API_AUTH_KEY: isolated-thread-engineering-fixture
      PROVIDER_DATA_DIR: /tmp/thread03-runtime
      TIKTOKEN_CACHE_DIR: /tmp/thread03-tokenizer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-thread-continuity-20260923
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply the authored patch only after exact source and byte validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/thread03-evidence
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd(); out=pathlib.Path('/tmp/thread03-evidence')
          base='f951e973f7a6e625d5ccf64f3e7a8bc4ceefc3b1'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()==['.github/workflows/image-thread-engineering.yml']
          parts=['7731efa32ae00325fdf6c86677c9ab9c1256eeff','e6cb6a34bb1c89b972ce9985aff8a482eb19f74e','0bdcf2ddd6884e726c5127a62116254c1ae6dbc4','fbdb8766c6df0a076443557b9d399ab5b85bfda7']
          raw=b''.join(base64.b64decode(json.loads(subprocess.check_output(['gh','api','repos/sunnywang666/chatgpt2api/git/blobs/'+sha]))['content']) for sha in parts)
          assert hashlib.sha256(raw).hexdigest()=='6595636c4528e83dee0a5f979f5efeaa27e4a3fd2b770e4cf40db5d82b972b8c'
          bundle=json.loads(gzip.decompress(raw)); assert bundle['base']==base and bundle['schema']==1
          allowed={'api/ai.py','api/external_images.py','api/image_inputs.py','api/image_tasks.py','docs/deployment.md','services/image_task_service.py','services/image_thread.py','services/pool_admission.py','services/protocol/conversation.py','test/test_image_thread_continuity.py'}
          assert {f['path'] for f in bundle['files']}==allowed
          for f in bundle['files']:
              p=root/f['path']; assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==f['base_sha256'],f['path']
          patch=out/'candidate.patch'; patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True);subprocess.run(['git','apply',str(patch)],check=True)
          for f in bundle['files']: assert hashlib.sha256((root/f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          (out/'source-manifest.json').write_text(json.dumps(bundle['files'],indent=2)+'\n')
          (out/'source-parent.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Install locked runtime and isolated test tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv pytest==9.1.1
          uv sync --frozen
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple pytest==9.1.1
          mkdir -p "$TIKTOKEN_CACHE_DIR" "$PROVIDER_DATA_DIR"
      - name: Verify new continuity and original owning contracts
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q api services utils test
          .venv/bin/python -m pytest -q test/test_image_thread_continuity.py 2>&1 | tee /tmp/thread03-evidence/thread-tests.log
          .venv/bin/python -m pytest -q test --ignore=test/test_generations.py --ignore=test/test_generations_url.py --ignore=test/test_gpt_ppt.py --ignore=test/test_gpt_psd.py --ignore=test/test_image.py --ignore=test/test_image_output_tokens.py --ignore=test/test_v1_chat_completions.py --ignore=test/test_v1_images_edits.py --ignore=test/test_v1_images_generations.py --ignore=test/test_v1_messages.py --ignore=test/test_v1_models.py --ignore=test/test_v1_responses.py 2>&1 | tee /tmp/thread03-evidence/owning.log
      - name: Commit only verified allowlisted product files on the original branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          out=pathlib.Path('/tmp/thread03-evidence'); files=json.loads((out/'source-manifest.json').read_text())
          for f in files: assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          subprocess.run(['git','add','--',*[f['path'] for f in files]],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())=={f['path'] for f in files}
          PY
          test "$(git ls-remote origin refs/heads/fix/image-thread-continuity-20260923 | cut -f1)" = "$(cat /tmp/thread03-evidence/source-parent.txt)"
          git config user.name sunnywang666
          git config user.email 197755426+sunnywang666@users.noreply.github.com
          git commit -m 'fix(images): continue product image generation and exact-image edits in original thread'
          git push origin HEAD:refs/heads/fix/image-thread-continuity-20260923
          git rev-parse HEAD > /tmp/thread03-evidence/product-head.txt
          git status --porcelain > /tmp/thread03-evidence/worktree-status.txt
          git archive --format=tar.gz -o /tmp/thread03-evidence/provider-source.tar.gz HEAD api services utils test docs scripts examples pyproject.toml uv.lock .python-version
      - name: Preserve authored source and evidence even if a gate fails
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          out=pathlib.Path('/tmp/thread03-evidence');out.mkdir(exist_ok=True)
          manifest=out/'source-manifest.json'
          if manifest.exists():
              for f in json.loads(manifest.read_text()):
                  p=pathlib.Path(f['path']);dest=out/'source'/f['path'];dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(p.read_bytes())
          sums={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}
          (out/'all-files-sha256.json').write_text(json.dumps(sums,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-thread-verified
          path: /tmp/thread03-evidence/
          retention-days: 14
