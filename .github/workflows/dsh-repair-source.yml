name: DSH repair source snapshot
on:
  push:
    branches: [fix/dsh-session-continuity-20260921]
    paths: [.github/workflows/dsh-repair-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked code only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-source"
          paths=(api services utils test docs)
          for f in pyproject.toml uv.lock config.json VERSION; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then paths+=("$f"); fi
          done
          git archive --format=tar.gz --output="$RUNNER_TEMP/dsh-source/provider-source.tar.gz" HEAD "${paths[@]}"
          git rev-parse HEAD > "$RUNNER_TEMP/dsh-source/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-repair-provider-source
          path: ${{ runner.temp }}/dsh-source/
          retention-days: 3
