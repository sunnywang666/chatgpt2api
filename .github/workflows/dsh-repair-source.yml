name: DSH repair source snapshot
on:
  push:
    branches: [fix/dsh-session-continuity-20260921]
    paths: [.github/workflows/dsh-repair-source.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch Python wheels, no application execution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/check-deps/wheels"
          python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); print('\n'.join(p['project']['dependencies'] + ['pytest','pytest-subtests','httpx']))" > "$RUNNER_TEMP/check-deps/requirements.txt"
          python -m pip wheel -r "$RUNNER_TEMP/check-deps/requirements.txt" -w "$RUNNER_TEMP/check-deps/wheels"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-repair-python-test-dependencies
          path: ${{ runner.temp }}/check-deps/
          retention-days: 3
