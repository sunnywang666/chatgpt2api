name: Provider POOL-02 isolated review

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - .github/workflows/pool02-scoped-ci.yml
      - services/conversation_binding_service.py
      - services/pool_admission.py
      - services/task_store.py
      - services/text_task_service.py
      - services/openai_backend_api.py
      - services/model_service.py
      - utils/helper.py
      - test/test_text_stream_diagnostics.py
      - test/test_text_stream_handoff.py
      - test/test_model_catalog_service.py
      - test/test_background_original_reads.py
      - test/test_pool_admission.py
      - test/test_rejected_chat_successor.py
      - test/test_missing_node_chain_lifecycle.py
      - test/test_queued_combined_copy_compaction.py
      - test/test_conversation_continuation.py
      - test/test_recovery_scan_progress.py

permissions:
  contents: read

jobs:
  scoped-chat-admission:
    # Only pushes created in this repository reach the persistent company runner.
    # Review external contributions first, then bring approved code into a trusted
    # main or codex/** branch with write access; fork PRs never execute here.
    # GitHub contributor approval and runner-group policy remain independent controls.
    if: ${{ github.repository == 'sunnywang666/chatgpt2api' }}
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","hugsweet-linux-ci"]') }}
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      CHATGPT2API_AUTH_KEY: isolated-pool02-fixture
      PROVIDER_DATA_DIR: /tmp/provider-pool02-fixture
      TIKTOKEN_CACHE_DIR: /tmp/provider-pool02-tokenizer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies and pytest
        run: |
          python -m pip install --disable-pip-version-check uv pytest==9.1.1
          uv sync --frozen
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple pytest==9.1.1
          mkdir -p "$PROVIDER_DATA_DIR" "$TIKTOKEN_CACHE_DIR"
      - name: Test account admission and bounded recovery
        run: |
          .venv/bin/python -m compileall -q api services utils test
          .venv/bin/python -m pytest -q \
            test/test_pool_admission.py \
            test/test_rejected_chat_successor.py \
            test/test_missing_node_chain_lifecycle.py \
            test/test_queued_combined_copy_compaction.py \
            test/test_background_original_reads.py \
            test/test_pool_resources.py \
            test/test_scoped_chat_slot_api.py \
            test/test_editable_pool_admission.py \
            test/test_pool_admission_identity.py \
            test/test_text_task_service.py \
            test/test_text_stream_diagnostics.py \
            test/test_text_stream_handoff.py \
            test/test_model_catalog_service.py \
            test/test_image_task_service.py \
            test/test_reliable_pool_routes.py \
            test/test_non_text_recovery.py \
            test/test_image_thread_continuity.py \
            test/test_incomplete_compact_successor.py \
            test/test_conversation_continuation.py \
            test/test_recovery_scan_progress.py
