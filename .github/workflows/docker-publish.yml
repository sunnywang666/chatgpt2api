name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full merged source commit to publish
        required: true
        type: string
      github_hosted:
        description: Use explicitly authorized GitHub-hosted build capacity
        required: false
        default: false
        type: boolean

env:
  IMAGE_NAME: chatgpt2api

concurrency:
  group: provider-publish-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

jobs:
  docker:
    if: ${{ github.repository == 'sunnywang666/chatgpt2api' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ${{ inputs.github_hosted == true && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","hugsweet-company-publisher"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve authorized source
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$DISPATCH_SHA"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUESTED_SOURCE" =~ ^[a-f0-9]{40}$ ]] || {
              echo 'source_ref must be a full commit SHA' >&2; exit 1;
            }
            comparison="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 60 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/sunnywang666/chatgpt2api/compare/$REQUESTED_SOURCE...$DISPATCH_SHA")"
            test "$(jq -r '.base_commit.sha' <<< "$comparison")" = "$REQUESTED_SOURCE"
            case "$(jq -r '.status' <<< "$comparison")" in
              ahead|identical) ;;
              *) echo 'source_ref must already be merged into the dispatched main commit' >&2; exit 1 ;;
            esac
            source_sha="$REQUESTED_SOURCE"
          fi
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact authorized source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify exact authorized checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up QEMU
        if: ${{ github.event_name == 'push' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ github.event_name == 'workflow_dispatch' && inputs.github_hosted != true && 'docker' || 'docker-container' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Resolve existing exact-source image
        id: existing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          IMAGE_REF: ghcr.io/sunnywang666/chatgpt2api:sha-${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          result_dir="$(mktemp -d)"
          trap 'rm -rf "$result_dir"' EXIT
          if docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' >"$result_dir/manifest.json" 2>"$result_dir/error"; then
            digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' "$result_dir/manifest.json")"
            printf 'exists=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest_unknown|manifest unknown' "$result_dir/error" || grep -Fq -- "$IMAGE_REF: not found" "$result_dir/error"; then
            printf 'exists=false\ndigest=\n' >> "$GITHUB_OUTPUT"
          else
            echo 'Registry read failed; refusing an unverified rebuild' >&2
            cat "$result_dir/error" >&2
            exit 1
          fi

      - name: Build and push image
        id: build
        if: ${{ github.event_name == 'push' || steps.existing.outputs.exists == 'false' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Print immutable image reference
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "provider=ghcr.io/sunnywang666/chatgpt2api@$IMAGE_DIGEST"
          echo "source_sha=$SOURCE_SHA"

      - name: Smoke test immutable Provider image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          IMAGE_REF="ghcr.io/sunnywang666/chatgpt2api@$IMAGE_DIGEST"
          NAME="provider-smoke-$RUN_ID-$RUN_ATTEMPT"
          CID=''
          # Called by the EXIT trap.
          # shellcheck disable=SC2329
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$CID" ]]; then
              if ! docker rm -f "$CID" >/dev/null; then
                echo 'Failed to remove this smoke container' >&2
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          docker pull --platform linux/amd64 "$IMAGE_REF"
          IMAGE_JSON="$(docker image inspect "$IMAGE_REF")"
          export IMAGE_JSON IMAGE_REF EXPECTED_REVISION
          python3 - <<'PY'
          import json, os
          image = json.loads(os.environ['IMAGE_JSON'])[0]
          if image.get('Architecture') != 'amd64' or image.get('Os') != 'linux':
              raise SystemExit('image platform mismatch')
          if image.get('Config', {}).get('Labels', {}).get('org.opencontainers.image.revision') != os.environ['EXPECTED_REVISION']:
              raise SystemExit('image revision label mismatch')
          PY
          CID="$(docker create --name "$NAME" --platform linux/amd64 --network none \
            --entrypoint /app/.venv/bin/uvicorn "$IMAGE_REF" \
            main:app --host 0.0.0.0 --port 80 --access-log)"
          CONTAINER_JSON="$(docker inspect "$CID")"
          export CONTAINER_JSON
          python3 - <<'PY'
          import json, os
          image = json.loads(os.environ['IMAGE_JSON'])[0]
          container = json.loads(os.environ['CONTAINER_JSON'])[0]
          if container.get('Config', {}).get('Image') != os.environ['IMAGE_REF']:
              raise SystemExit('container image reference mismatch')
          if container.get('Image') != image.get('Id'):
              raise SystemExit('container image ID mismatch')
          if container.get('HostConfig', {}).get('NetworkMode') != 'none':
              raise SystemExit('container network mode mismatch')
          if container.get('Mounts') != []:
              raise SystemExit('unexpected business/data mount')
          PY
          docker start "$CID" >/dev/null
          for ((attempt=0; attempt<30; attempt++)); do
            if HEALTH=$(docker exec -i "$CID" /app/.venv/bin/python - <<'PY'
          import json, urllib.request
          r = urllib.request.urlopen('http://127.0.0.1/health?format=json', timeout=3)
          body = r.read().decode()
          if r.status != 200 or not body:
              raise SystemExit('health HTTP/status/body check failed')
          data = json.loads(body)
          storage = data['storage']['health']
          backend = data['storage']['backend']
          if storage.get('status') != 'healthy':
              raise SystemExit('storage health is not healthy')
          if storage.get('backend') != 'json' or backend.get('type') != 'json':
              raise SystemExit('unexpected storage backend')
          print(json.dumps({'http_status': r.status, 'storage_health': storage['status'],
                            'storage_backend': backend['type'], 'pool_status': data['status'],
                            'pool_healthy': data['healthy']}, sort_keys=True))
          PY
            ); then
              printf '%s\n' "$HEALTH"
              exit 0
            fi
            sleep 1
          done
          docker logs "$CID" >&2 || true
          exit 1
